stac:
  url: https://data.inpe.br/bdc/stac/v1/
  colecao: S2-16D-2
area:
  nome: Mato Grosso
  uf: MT
  bbox:
  - -61.65
  - -18.05
  - -50.2
  - -7.3
periodo:
  inicio: '2025-09-01'
  fim: '2026-04-30'
bandas:
- B02
- B03
- B04
- B05
- B06
- B07
- B08
- B8A
- B11
- B12
- NDVI
- EVI
qualidade:
  filtrar_nuvens: true
  nuvem_max_pct: 40.0
  manter_scl: true
  camadas_auxiliares:
  - SCL
  - CLEAROB
  - TOTALOB
  - PROVENANCE
preview:
  gerar_rgb: true
  tamanho_max_px: 1600
  metodo: percentile
  percentil_min: 2.0
  percentil_max: 98.0
  qualidade_jpeg: 92
dataset:
  gerar: false
  pasta: data/dataset
  catalogo: catalogo/patches.csv
  rgb:
    gerar_png: true
    metodo: fixed
    minimo: 0.0
    maximo: 2000.0
    percentil_min: 2.0
    percentil_max: 98.0
  patches:
    habilitado: true
    tamanho_px: 512
    stride_px: 512
    nuvem_max_pct: 10.0
    dados_validos_min_pct: 90.0
    max_patches_por_cena: 100000
  gerar_geotiff_multibanda: true
  gerar_metadata_json: true
download:
  pasta: data/sentinel2
  catalogo: catalogo/catalogo_imagens.csv
  timeout_segundos: 120
  chunk_mb: 1
  max_itens_teste: 5
  max_candidatos_teste: 40
analise:
  modelo: analise/models/agricultura.pt
  modelo_sha256: ''
  confianca_minima: 0.25
  iou_maximo: 0.45
  tamanho_inferencia_px: 640
  pasta: data/analises
  historico: data/historico-analises.sqlite3
  gerar_relatorio: true
  max_imagens: 1000
sincronizacao:
  pasta_remota: sentinel2-mt
  oauth_json: ${GOOGLE_OAUTH_JSON:-}
  token_json: ${GOOGLE_TOKEN_JSON:-config/google-token.json}
  pasta_id: ${GOOGLE_PASTA_ID:-root}
  tamanho_lote: 100
  extensoes:
  - .tif
  - .tiff
  - .jpg
  - .jpeg
